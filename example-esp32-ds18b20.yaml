substitutions:
  name: ds18b20-esp32
  friendly_name: "DS18B20 Temperatur"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source: github://Lere-q/dallas-patched
    components: [dallas_patched]
    refresh: 0s

logger:
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  password: !secret ota_password

web_server:
  port: 80

sensor:
  - platform: dallas_patched
    pin:
      number: 16
      mode: input_pullup
    name: "Temperatur"
    id: temp_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    device_class: temperature
    state_class: measurement
    update_interval: 15s
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
